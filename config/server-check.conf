# Literal KEY=VALUE entries. No shell expressions or quotes are evaluated.
# MODE=interactive means a technician invokes the launcher manually.
# MODE=auto runs the configured read-only suite without prompts.
MODE=interactive
AUTO_START=no

RUN_CPU=yes
RUN_MEMORY=yes
RUN_STORAGE=yes
RUN_SMART=yes
RUN_RAID=yes
RUN_NETWORK=yes
RUN_SENSORS=yes
RUN_PCIE=yes
RUN_LOG_ANALYSIS=yes
RUN_FIRMWARE=yes
RUN_BMC=yes

# both writes report.json and report.txt alongside the raw evidence report.
REPORT_FORMAT=both
# path uses REPORT_LOCATION; temp uses ${TMPDIR:-/tmp}; usb detects a mounted writable USB filesystem.
REPORT_TARGET=path
REPORT_LOCATION=/tmp/server-check-reports
CHECK_TIMEOUT_SECONDS=300
