set default=0
set timeout=@BOOT_TIMEOUT_SECONDS@
set timeout_style=menu

menuentry 'Automatic Safe Diagnostics' {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ diag.mode=auto diag.autostart=yes diag.profile=standard
    initrd @INITRD_LIVE@
}
menuentry 'Interactive Diagnostics' {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ diag.mode=interactive diag.autostart=no
    initrd @INITRD_LIVE@
}
menuentry 'Linux Rescue Shell' {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ diag.mode=rescue diag.autostart=no
    initrd @INITRD_LIVE@
}
