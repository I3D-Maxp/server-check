[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-check"
version = "0.1.0"
description = "Linux server diagnostic toolkit"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
server-check = "server_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
